<html>
    <body>
        <h2>JavaScript async / await</h2>

<h1 id="result"></h1>
<script>
async function product(a, b , c) {
    let response = await a * b * c;
    display(response);
}

function display(some) {
    document.getElementById("result").innerHTML = some;
}
product(78300,34562,3902);
</script>
</body>
</html>
