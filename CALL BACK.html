<html>
    <body>
        <h1>"CALLBACK IN JS"</h1>
        <p id = "result"></p>
        <script>
            function myDisplayer (value) {
                document.getElementById("result").innerHTML = value;

            }
            function myCalculator ( num1 , num2 ,myCallback ) { 
                let sum = num1 + num2;
                myCallback  (sum);
            }
            myCalculator ( 78 ,67, myDisplayer) ;
        </script>
    </body>
</html>
