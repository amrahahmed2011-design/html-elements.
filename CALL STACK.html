        <title>CALL STACK</title>

    <body>
        <h1>CALL SATCK IN JAVASCRIPT</h1>
        <p>DO A CALCULATION AND THEN DISPLAY THE RESULT</p>
        <p id="demo"></p>
        <script>
            function add(a , b , c)
            {return a+b+c};
            function average(a , b , c)
            {return (a,b,c)/ 3};
            let result = average(30,4536,743)
            document.getElementById("demo").innerHTML = result;
        </script>
    </body>
