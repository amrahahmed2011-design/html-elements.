<html>
    <head>
        <title>"GENERATE RANDOM NUMBERS USING A WHILE LOOP"</title>
    </head>
    <body>
        <h1>"JAVASCRIPT WHILE LOOPS"</h1>
        <p id="number"></p>
    </body>
    <script>
        var text ="  "
        var i = 0
        while (i < 23) {
            text += "<br> THE NUMBER IS  "  + i;
            i++;
        }
document.getElementById("number").innerHTML = text;
    </script>
</html>
