<html>
    <head>
        <title>INHERITANCE CLASS</title>
    </head>
    <body>
<h2>JavaScript Class Inheritance</h2>

<p id="details"></p>
<script>

class Grade extends Student {
    constructor(name, grade) {
    super(name);
    this.studentGrade = grade;
    }

    show() {
    return this.present() + "from"  + this.studentGrade;
    }
}
let myStudent = new Grade("AMRAH", "grade 9")
document.getElementById("details").innerHTML =
myStudent.show();
</script>
</body>
</html>
