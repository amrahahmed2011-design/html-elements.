<html>
  <body>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <script>
var data = {
    name:"MARAH",
    age: '15',
    Grade: 'NINTH/9',
    hobbies: "SKETCHING,CROCHETING,"
};
var color = ["purple", "black", "red", "aqua", "blue"];
document.write("MY name is : " + data.name,)
document.write("<br>Before Poping : " + color.join("^"));
document.write("<br>My favorite color is : " + color[3]);
color.pop();
document.write("<br>After Poping  : " + color.join("*"));
</script>
</body>
</html>
