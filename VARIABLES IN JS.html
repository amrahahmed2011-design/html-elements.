<html>
    <head>
        <title>VARIABLES IN JS</title>
    
    </head>
    <body>
        <h1>VARIABLES IN JAVA SCRIPT</h1>
        <p>SUM OF TWO NUMBERS</p>
        <p id="result"></p>
        <script>
            var num1=3721;
            var num2=6094;
            var num3=76;
            var num4=4120;
            var sum=num1+num2+num3+num4;
            document.getElementById("result").innerHTML=
            "THE TOTAL SUM IS   " +sum
        </script>
    </body>
</html>
