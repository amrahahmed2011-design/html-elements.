<html>
    <head>
        <title>MULTIPLICATION USING FUNCTIONS</title>
</head>
  <body>
    <h1 style="color:aquamarine">MULTIPLICATION USING FUNCTIONS</h1>
    <p>A function can access variables defined inside the function:</p>
    <button type="button" onclick="myFunction()">Click Me!</button>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>
    <script>
    var b = 654;
    function myFunction() {
    var a = 56;
    var c =289
    var d =5432
    document.getElementById("demo").innerHTML = b * a * c * d;
    }
    document.getElementById("demo1").innerHTML = a;
    document.getElementById("demo2").innerHTML = b;
    document.getElementById("demo3").innerHTML = c;
    document.getElementById("demo4").innerHTML = d;
    </script>
  </body>
</html>
</html>
