<html>
<head>
    <title>"JavaScript Math Object Homework"</title>
</head>
<body>
    <p>Finding the largest number with help of Argument Objects</p>
<p id="result"></p>
<script>
    var value = Math.acos(.53462);
    document.write("Demo1 Test Value : " + value
    + "<br>");

    var value = Math.asin(.610);
    document.write("Demo2 Test Value : " + value
    + "<br>");

    var value = Math.atan(.32);
    document.write("Demo3 Test Value : " + value
    + "<br>");

    function print() {
    var i;
    var print = 0;
    for(i = 0; i < arguments.length; i++) {
    if (arguments[i] > print ) {
    print = arguments[i];
    }
    }
    return print;
    }
    document.getElementById("result").innerHTML = print("value");
    </script>
</body>
</html>
