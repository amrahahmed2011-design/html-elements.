html>
    <head>
        <title>FORMS IN HTML</title>
    </head>
    <body>
        <form>
        <h2>PERSONAL DETAIL FORM</h2>
            <label>NAME</label><br>
            <input type="text" id="name"><br><br>
            <label>EMAL ID</label><br>
            <input type="text" id="email"><br><br>
            <label>CONTACT NUMBER (THIS WILL BE HIDDEN)</label><br>
            <input type="password" id="contact"><br><br>
            <label>GENDER</label><br>
            <input type="radio" id="female" name="gender" value="female">FEMALE<br>
            <input type="radio" id="male" name="gender" value="male">MALE<br><br>
            <label>FAVOURITE CITY</label><br>
            <input type="checkbox" id="city" value="ISLAMABAD">ISLAMABAD<br>
            <input type="checkbox" id="city" value="LAHORE">LAHORE<br><br>
<input type="SUBMIT">
<fieldset>
    <legend>PERSONAL INFORMATION:</legend>
    <label>FULL NAME</label>
    <input type="text" id="fname" placeholder="ENTER NAME"><br><br>
<label>EMAIL:</label>
    <input type="text" id="email"><br><br>
    <label>GENDER:</label>
    <input type="radio" id="gender" value="FEMALE">FEMALE<br>
    <input type="radio" id="gender" value="MALE">MALE<br>
    <label>BIRTHDAY:</label>
    <input type="date" id="birthday" name="birthday"><br><br>
</fieldset>
        </form>
    </body>
</html>
