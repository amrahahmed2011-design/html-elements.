<html>
    <head>
        <style>
            div {right:40px;
            border:5px solid skyblue;}
            div.absolute {position:absolute;
            left:80px;
        border:5px solid mediumorchid;}
        div.relative {position:relative;
        left:200px;
    border:5px solid teal;}
    div.fixed {position:fixed;
    top:0;
right:40px;
width:500px;
border:5px solid seagreen;}
div.sticky {position:sticky;
top:3px;
left:40px;
width:200px;
border:4px solid darkmagenta;}
        </style>
    </head>
    <body>
        <h2>POSITIONING</h2>
        <div>
            DIV WITH NO POSITION PROPERTY
        </div>
        <div class="sticky">
            DIV WITH STICKY POSITION PREPERTY
        </div>
        <div class="relative">
            DIV WITH RELATIVE POSITION PROPERTY
        </div>
        <div class="absolute">
            DIV WITH ABSOLUTE POSITION PROPERTY
        </div>
<div class="fixed">
    DIV WITH FIXED POSITION PROPERTY
</div>
    </body>
</html>
