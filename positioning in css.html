<html>
    <head>
        <style>
            div {right:30px;
            border:3px solid skyblue;}
            div.absolute {position:absolute;
            left:50px;
        border:4px solid mediumorchid;}
        div.relative {position:relative;
        left:100px;
    border:3px solid teal;}
    div.fixed {position:fixed;
    top:0;
right:20px;
width:300px;
border:3px solid seagreen;}
div.sticky {position:sticky;
top:1px;
left:20px;
width:100px;
border:3px solid darkmagenta;}
        </style>
    </head>
    <body>
        <h2>POSITIONING</h2>
        <div>
            DIV WITH NO POSITION PROPERTY
        </div>
        <div class="sticky">
            DIV WITH STICKY POSITION PREPERTY
        </div>
        <div class="relative">
            DIV WITH RELATIVE POSITION PROPERTY
        </div>
        <div class="absolute">
            DIV WITH ABSOLUTE POSITION PROPERTY
        </div>
<div class="fixed">
    DIV WITH FIXED POSITION PROPERTY
</div>
    </body>
</html>
