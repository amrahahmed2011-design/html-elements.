<!DOCTYPE html>
<html>
<head>
    <title>Navbar</title>
    <style>
    body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    }
    .topnav {
    overflow: hidden;
    background-color:darkmagenta;
    }
    .topnav a {
    float: left;
    color: plum;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    font-size: 17px;
    }
    .topnav a:hover {
    background-color:goldenrod;
    color:firebrick;
    }
    .topnav a.active {
    background-color: powderblue;
    color:darkred;
    }
    </style>
</head>
<body>

</body>
</html></style>
