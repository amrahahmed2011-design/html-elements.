<html>
    <head>
        <title>TEXT SHADOW AND BOX SHADOW</title>
        <style>
            *{text-align:center;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;}
            #text{text-shadow:2px 2px 1px;
            color:blueviolet;}
            /*(right-offset)px (left-offset)px (fade)px color*/
            #box{box-shadow:9px 9px 5px;
            color:darkkhaki}
            /*(right-offset)px (left-offset)px (fade)px color*/
            #indent{text-indent:50%;}
        </style>
    </head>
    <body>
        <h1 id="text">we can use text shadow to give shadow to the text itself</h1>
        <h1 id="box">or use box shadow to five shadoe to the box itself</h1>
        <div>
            <p>this is the example of text text-indent</p>
            <p id="indent">this is the example od text indent</p>
        </div>
    </body>
</html>
